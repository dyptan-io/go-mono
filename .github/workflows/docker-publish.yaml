name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate path filters
        id: gen
        run: |
          {
            echo "filters<<EOF"
            echo "shared:"
            echo "  - 'internal/pkg/**'"
            for app in $(ls cmd); do
              echo "${app}:"
              echo "  - 'cmd/${app}/**'"
              echo "  - 'internal/service/${app}/**'"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: ${{ steps.gen.outputs.filters }}

      - name: Resolve apps
        id: apps
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ "$SHARED" == "true" ]]; then
            echo "apps=$(ls cmd | jq -Rcs '[split("\n")[] | select(length > 0)]')" >> "$GITHUB_OUTPUT"
          else
            echo "apps=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.app }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
